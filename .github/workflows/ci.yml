name: CI — Qualidade e Tipagem

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  qualidade:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar dependências
        run: uv sync --locked --extra dev
      - name: Verificar lint (Ruff)
        run: uv run --locked ruff check src
      - name: Verificar tipagem estrita (Mypy)
        run: uv run --locked mypy src
      - name: Rodar testes (Pytest)
        run: uv run --locked pytest -q
